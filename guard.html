<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoicePath AI – Guard & Volunteer Dispatch Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .guard-container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }
    .alert-card {
      background: var(--bg-surface);
      border: 2px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .alert-card.pending {
      border-color: #ef4444;
      background: #1c131d;
      animation: pulseBorder 1.5s infinite alternate;
    }
    .alert-card.acknowledged {
      border-color: #22c55e;
      opacity: 0.85;
    }
    @keyframes pulseBorder {
      0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
      100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.7); }
    }
    .alert-info h3 {
      font-size: 20px;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .alert-meta {
      font-size: 14px;
      color: var(--text-muted);
    }
    .alert-meta strong {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-logo-icon">🛡️</div>
      <div>
        <h1 class="brand-title">Guard & Security Dispatch</h1>
        <div class="brand-tagline">VoicePath AI Emergency Assistance Station</div>
      </div>
    </div>
    <a href="index.html" class="btn btn-outline btn-sm">⬅ Back to User App</a>
  </header>

  <main class="guard-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Live Assistance Requests</h2>
      <button type="button" id="btn-test-alert" class="btn btn-outline btn-sm">⚡ Simulate Test Alert</button>
    </div>

    <div id="alerts-list">
      <div style="text-align: center; color: var(--text-muted); padding: 40px 20px; background: var(--bg-surface); border-radius: 14px;">
        No active calls. Waiting for student requests...
      </div>
    </div>
  </main>

  <script type="module">
    import { initGuardDashboard, acknowledgeAlert } from "./js/guard.js";
    import { enforceStaffAuth } from "./js/authClient.js";

    const alertsListEl = document.getElementById("alerts-list");
    const activeAlerts = new Map();

    enforceStaffAuth("guard", (session) => {
      console.log("[Guard Dashboard] Authenticated as:", session.username, "(Role:", session.role + ")");
    });

    // Chime generator
    function playAlertChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function renderAlerts() {
      if (activeAlerts.size === 0) {
        alertsListEl.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 40px 20px; background: var(--bg-surface); border-radius: 14px;">
            No active calls. Station standing by.
          </div>
        `;
        return;
      }

      let html = "";
      for (const [reqId, alert] of activeAlerts.entries()) {
        const timeStr = new Date(alert.timestamp).toLocaleTimeString();
        const isPending = alert.status !== "acknowledged";

        html += `
          <div class="alert-card ${isPending ? 'pending' : 'acknowledged'}">
            <div class="alert-info">
              <h3>🚨 Request: ${alert.userLabel || 'Student'}</h3>
              <div class="alert-meta">
                Location: <strong>${alert.nodeName}</strong> (${alert.lastNodeId})<br>
                Landmark: <strong>${alert.landmark || 'Standard corridor'}</strong><br>
                Time: <strong>${timeStr}</strong> | Step-Free: <strong>${alert.stepFreeNeeded ? 'Yes (Wheelchair)' : 'No'}</strong>
              </div>
            </div>
            <div>
              ${isPending ? `
                <button type="button" class="btn btn-success" onclick="window.handleAck('${reqId}')">
                  ✓ Acknowledge & Send Help
                </button>
              ` : `
                <span class="badge-success" style="padding: 8px 16px; border-radius: 8px; font-weight: bold; background: #14532d; color: #86efac;">
                  ✓ Guard Dispatched
                </span>
              `}
            </div>
          </div>
        `;
      }
      alertsListEl.innerHTML = html;
    }

    window.handleAck = (reqId) => {
      const alert = activeAlerts.get(reqId);
      if (alert) {
        alert.status = "acknowledged";
        acknowledgeAlert(reqId, "Desk Guard 1");
        renderAlerts();
      }
    };

    initGuardDashboard((newAlert) => {
      newAlert.status = "pending";
      activeAlerts.set(newAlert.requestId, newAlert);
      playAlertChime();
      renderAlerts();
    });

    document.getElementById("btn-test-alert").addEventListener("click", () => {
      const mockReq = {
        type: "GUARD_REQUEST",
        requestId: "TEST-" + Date.now().toString(36),
        timestamp: Date.now(),
        userLabel: "Demo Student",
        lastNodeId: "j3",
        nodeName: "Central Crossing",
        landmark: "Large Notice Board",
        stepFreeNeeded: false
      };
      mockReq.status = "pending";
      activeAlerts.set(mockReq.requestId, mockReq);
      playAlertChime();
      renderAlerts();
    });
  </script>
</body>
</html>
